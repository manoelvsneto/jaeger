pool:
  name: Arm64
  vmImage: 'ubuntu-22.04'

trigger:
- main
resources:
- repo: self
variables:
  imagePullSecret: 'regcred'
stages:
- stage: Build
  displayName: Build stage
  jobs:
  - job: Build
    displayName: Build
    steps:

    - task: KubernetesManifest@0
      displayName: Deploy to Kubernetes cluster
      inputs:
        kubernetesServiceConnection: K8SOracleCloud
        action: deploy
        manifests: |
          $(Build.SourcesDirectory)/k8s/00-namespace.yml
          $(Build.SourcesDirectory)/k8s/01-configmap.yml
          $(Build.SourcesDirectory)/k8s/02-deployment.yml
          $(Build.SourcesDirectory)/k8s/03-service.yml
          $(Build.SourcesDirectory)/k8s/04-ingress.yml
          $(Build.SourcesDirectory)/k8s/05-secrets.yml
        imagePullSecrets: |
          $(imagePullSecret)
        containers: 'jaegertracing/all-in-one:1.72.0'